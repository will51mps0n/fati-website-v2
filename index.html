<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fatima Castro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Fatima Castro — projects, portfolio, and experience. Master of Architecture candidate, Rice University.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap">
<style>
:root{--bg:#FFFFFF;--fg:#111111}
html.about{--bg:#080808;--fg:#F5F3EF}
html{background:var(--bg);scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:"EB Garamond","Adobe Garamond Pro",Garamond,Georgia,serif;
  font-weight:550;
  font-variant-numeric:oldstyle-nums;
  font-feature-settings:"onum" 1,"liga" 1;
  -webkit-font-smoothing:antialiased;
}
/* Helvetica Bold, self-hosted and subset to Latin, for the fixed corners
   only. The page text stays EB Garamond. */
@font-face{
  font-family:"Helvetica";
  src:url("fonts/helvetica-bold.woff2") format("woff2");
  font-weight:700;
  font-style:normal;
  font-display:swap;
}

[hidden]{display:none!important}
img{max-width:100%}

/* ---- the only affordance ---- */
a{color:inherit;text-decoration:none}
.info-toggle{font:inherit;font-variant-numeric:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a:focus-visible,.info-toggle:focus-visible{outline:none}
a:hover,a:focus-visible,
.about-link.active,
.info-toggle{
  text-decoration:underline;
  text-underline-offset:.14em;
  text-decoration-thickness:1px;
}

/* ---- fixed chrome ---- */
.wordmark,.about-link,.nav,.ig{position:fixed;z-index:10}
/* Helvetica Bold carries the titling: the fixed corners, the Experience
   section headers, the About lead, and the portfolio's cover, contents and
   project title pages. Body copy, figure captions, spread legends and
   project metadata stay Garamond. Only a 700 face is supplied, so each of
   these is set to 700 rather than inheriting the 550 body weight. */
.wordmark,.about-link,.nav,
.about-h,
.sp-sw,.sp-ctitle,.sp-cnum,.sp-centry,
.sp-h1,.sp-num,.sp-sub{
  font-family:"Helvetica","Helvetica Neue",Arial,sans-serif;
  font-weight:700;
  font-variant-numeric:normal;
  font-feature-settings:normal;
}
.wordmark{
  top:calc(34px + env(safe-area-inset-top,0px));
  left:calc(34px + env(safe-area-inset-left,0px));
  font-size:44px;line-height:1;letter-spacing:.01em;
}
.about-link{
  top:calc(34px + env(safe-area-inset-top,0px));
  right:calc(34px + env(safe-area-inset-right,0px));
  font-size:44px;line-height:1;
}
.nav{
  left:calc(34px + env(safe-area-inset-left,0px));
  bottom:calc(34px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:flex-start;
  font-size:38px;line-height:1.10;
}
.ig{
  right:calc(34px + env(safe-area-inset-right,0px));
  bottom:calc(34px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;gap:16px;line-height:0;
}
.ig svg{width:24px;height:24px;display:block}

/* ---- the centred column ---- */
#main{width:46vw;max-width:1040px;min-width:520px;margin:0 auto;padding:18vh 0 42vh}

/* ---- Projects: one carousel slot per project ---- */
.entry{margin:0 0 45vh}
.entry:last-child{margin-bottom:0}
.stage{position:relative;width:100%}
.frame{position:relative;margin:0 auto}
.frame img{display:block;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .4s ease}
.frame img.loaded{opacity:1}

/* carousel arrows — on hover, pinned just outside the column (the widest
   a frame can be) so they hold one position for every image */
.arrow{
  position:absolute;top:0;bottom:0;width:calc(50% + 72px);
  display:flex;align-items:center;
  background:none;border:0;margin:0;padding:0;
  color:inherit;cursor:pointer;opacity:0;transition:opacity 80ms linear;
}
.arrow.prev{left:-72px;justify-content:flex-start;padding-left:18px}
.arrow.next{right:-72px;justify-content:flex-end;padding-right:18px}
.arrow:hover,.arrow:focus-visible{opacity:1;transition-duration:80ms}
.arrow:not(:hover){transition-duration:0s}
.arrow svg{width:22px;height:22px;display:block}
.arrow:focus-visible{outline:none}

figcaption{margin-top:26px;text-align:center;font-size:22px;line-height:1.42}
.cap-name{font-style:italic}
.info{margin:1.42em auto;width:30vw;max-width:30vw;font-size:20px;line-height:1.5}

/* ---- Portfolio: composed two-page spreads, laid out like the book ---- */
.pf-cover{margin:0 auto 16vh}
.pf-cover img{display:block;max-width:100%;max-height:84vh;width:auto;height:auto;margin:0 auto}
.pf-cover figcaption{margin-top:26px;text-align:center;font-size:22px;line-height:1.42}

/* Every position inside a spread is a % of the spread, and every type
   size is cqw (1% of the spread's width), so a page scales as one piece. */
.spread{display:flex;gap:0;width:100%;margin:0 auto 14vh}
.spread:last-child{margin-bottom:0}
/* the two pages stay stuck together as one horizontal spread, with no
   ground of their own — the route's white field runs straight through */
.page{position:relative;flex:1 1 50%;aspect-ratio:1000/1331;
      container-type:inline-size;background:transparent}
.spread.single .page{flex:1 1 100%;aspect-ratio:var(--ar,2000/1331)}
.page.dark{background:#000}
.page.dark .sp-item{color:#F2F0EC}
.page.dark .sp-cap,.page.dark .sp-folio{color:#8f8b85}
/* only a phone is too narrow to hold a spread side by side */
@media (max-width:700px){
  .spread{flex-direction:column;gap:4vh}
  .page{flex:none;width:100%}
}
.sp-item{position:absolute;margin:0;line-height:1.45;text-align:left;font-size:inherit}
.sp-img{position:absolute;display:block;opacity:0;transition:opacity .4s ease}
.sp-img.loaded{opacity:1}
.sp-h1{font-weight:700;line-height:1.08}
.sp-num{font-weight:700;line-height:1}
.sp-sub{line-height:1.3}
.sp-cap{line-height:1.35;color:#8d8a85}
.sp-cap.light{color:#fff}
.sp-sw,.sp-name,.sp-ctitle{font-weight:700;line-height:1.05}
.sp-label,.sp-centry,.sp-csub{color:#8d8a85}
.sp-centry,.sp-csub{letter-spacing:.05em;line-height:1.55}
.sp-cnum{font-weight:700;font-style:italic;line-height:1}
.sp-folio{color:#8d8a85;position:absolute;bottom:4.5%}
.sp-legend{line-height:1.75}
.sp-legend-t{font-style:italic;margin-bottom:.55em}

/* ---- Experience: text only, same centred column ---- */
.experience{text-align:center;font-size:22px;line-height:1.42}
.xp-group{margin-bottom:7vh}
.xp-group:last-child{margin-bottom:0}
.xp-group-title{font-style:italic;font-weight:700;font-size:1.14em;margin-bottom:1.8em}
.xp{margin-bottom:2em}
.xp:last-child{margin-bottom:0}
.xp-role{font-style:italic}

/* the spreads run nearly full width, so the corners step back for them */
html.portfolio #main{width:auto;max-width:none;min-width:0;
  padding:13vh clamp(140px,8.5vw,180px) 16vh}

/* corners lighten over a black page so they stay legible */
html.on-dark .wordmark,html.on-dark .about-link,html.on-dark .nav a,html.on-dark .ig{color:#F2F0EC}

/* ---- About ---- */
html.about #main{width:auto;max-width:none;min-width:0;padding:0}
.about-wrap{min-height:100vh;display:grid;place-items:center;box-sizing:border-box;padding:14vh 0}
.about-col{width:60vw;margin:0 auto;text-align:center}
.about-sec + .about-sec{margin-top:3.2em}
.about-h{font-size:clamp(19px,1.6vw,25px);line-height:1.3;margin:0 0 .8em}
.about-col p{font-size:clamp(18px,1.5vw,23px);line-height:1.55;margin:0 0 1.55em}
.about-col p:last-of-type{margin-bottom:0}
.about-list{font-size:clamp(16px,1.3vw,20px);line-height:1.75}

@media (prefers-reduced-motion:reduce){.frame img,.pf-fig img{transition:none}}

/* ---- below 900px ---- */
@media (max-width:900px){
  #main{width:86vw;min-width:0}
  .wordmark,.about-link{font-size:26px}
  .wordmark{top:calc(20px + env(safe-area-inset-top,0px));left:calc(20px + env(safe-area-inset-left,0px))}
  .about-link{top:calc(20px + env(safe-area-inset-top,0px));right:calc(20px + env(safe-area-inset-right,0px))}
  /* four links no longer fit one phone-width row, so let them wrap; the
     row gap stays 0 so a wrapped nav stacks as tightly as the desktop one */
  .nav{flex-direction:row;flex-wrap:wrap;gap:0 16px;font-size:22px;line-height:1.2;
       left:calc(20px + env(safe-area-inset-left,0px));
       max-width:calc(100vw - 40px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));
       bottom:calc(62px + env(safe-area-inset-bottom,0px))}
  .ig{right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .arrow{width:50%}
  .arrow.prev{left:0;padding-left:10px}
  .arrow.next{right:0;padding-right:10px}
  figcaption,.pf-cap{font-size:19px}
  .entry{margin-bottom:28vh}
  .info{width:80vw;max-width:80vw;font-size:17px}
  html.portfolio #main{padding:12vh 2vw 14vh}
  .spread{margin-bottom:6vh;gap:4vh}
  .pf-cover{margin-bottom:12vh}
  .pf-cover figcaption{font-size:19px}
  .experience{font-size:19px}
  .xp-group{margin-bottom:6vh}
  .about-col{width:88vw}
}

/* Helvetica Bold sets wider than the Garamond it replaced, so on the
   narrowest phones the wordmark and the About link need a step down to
   stay off each other */
@media (max-width:400px){
  .wordmark,.about-link{font-size:22px}
}
</style>

,"f18","f19","f20"],"info":{"date":"Fall 2025","professor":"Carlos Jimenez","institution":"Rice University"},"intro":"In the early twentieth century, commercial logging and cattle ranching drove economic growth in Costa Rica while steadily eroding its ecological richness. Towards the end of the century, a movement toward forest regeneration through policymaking reestablished a hierarchy in which nature takes precedence over human infrastructure. The question is then posed: how can we align the built environment with Costa Rica's ecological values? In this framework, it positions the research center as secondary to the forest, using assembly and hierarchy to support ecological processes rather than imposing on the site.","spreads":[{"folios":[["4",2.2],["5",96.2]],"items":[{"t":"h1","x":6,"y":6,"w":42,"size":2.5,"txt":"Biodiversity Research Center"},{"t":"sub","x":6,"y":13,"w":42,"size":1.2,"txt":"Guanacaste Peninsula, Costa Rica"},{"t":"num","x":3,"y":19,"size":5.4,"txt":"01"},{"t":"meta","x":3,"y":31,"w":22,"size":1.05,"txt":"Professor: Carlos Jimenez\nYear: Fall 2025"},{"t":"body","x":3,"y":44,"w":21,"size":1.05,"txt":"In the early twentieth century, commercial logging and cattle ranching drove economic growth in Costa Rica while steadily eroding its ecological richness. Towards the end of the century, a movement toward forest regeneration through policymaking reestablished a hierarchy in which nature takes precedence over human infrastructure. The question is then posed: how can we align the built environment with Costa Rica's ecological values? In this framework, it positions the research center as secondary to the forest, using assembly and hierarchy to support ecological processes rather than imposing on the site."},{"fig":"f01","x":28,"y":18,"w":20,"h":64,"alt":"Material narrative drawing"},{"fig":"f02","x":49.5,"y":0,"w":50.5,"h":100,"fit":"cover","alt":"Playa Islita site plan"},{"t":"cap","x":3,"y":88,"w":42,"size":0.95,"txt":"01. Material Narrative, Repurposing and Sourcing Locally\n02. Playa Islita Site, Cliff's Edge"}]},{"folios":[["6",2.2],["7",96.2]],"items":[{"fig":"f03","x":3.6,"y":9,"w":44,"h":44,"alt":"Interior view of the gallery"},{"t":"cap","x":3.6,"y":55,"w":30,"size":0.95,"txt":"03. Interior View of the Gallery"},{"t":"body","x":3.6,"y":59.5,"w":22,"size":0.98,"txt":"Drawing from Costa Rica's historic occupation and extraction of the land, the project adopts teak as its primary structure but reframes it within a regenerative logic. The building uses a combination of onsite hardwoods and locally sourced recycled and scrap teak from a nearby mill in the city of Samara, reducing transportation demand, avoiding new clear-cutting, and extending the life of materials already harvested. Glue-laminated teak beams and columns scale this material up to an institutional frame while maintaining a thin structure. In a context where contemporary institutional buildings are largely constructed with concrete and steel, the project treats teak as a precise, high-performance structural medium that ties the research center to managed forestry and rural economies."},{"t":"body","x":28,"y":59.5,"w":22,"size":0.98,"txt":"The center's footprint minimizes excavation, allowing the ground to remain largely intact. The center is conceived as secondary to the landscape. It touches the ground at spaced 4x10 GLT columns locked to a 10' grid. The rigid regularity of the column grid serves as a means to soften the building's edge, allowing water, soil, and wildlife to move freely beneath. At the heart of the project, the aviary and plant nursery anchor the courtyard into the ground, dropping the floor of the enclosures and marking the reintegration of the species into their habitat. Together, they set the ground conditions and organize circulation, so that paths wrap the aviary and move through apertures that maintain clear visual continuity between programs."},{"t":"legend","x":71,"y":53,"w":6.2,"size":0.78,"align":"right","title":"Ground Plan","items":["Lobby","Theatre","Gallery","Water Closets","Mech","Office Suites","Conference","Cafe","Aviary","Archival Room","Laboratories","Apartments","Lounge"]},{"fig":"f04","x":77.2,"y":8,"w":20.8,"h":76,"alt":"Ground plan"},{"t":"cap","x":77.2,"y":86,"w":20,"size":0.95,"txt":"04. Ground Plan"},{"t":"body","x":52.8,"y":59.5,"w":13.3,"size":0.98,"txt":"The two primary bars, one public and one private, are distinguished by their prominence and recession. The public wing is more open and lightly programmed, with interstitial zones between rooms that can absorb exhibitions, gatherings, or informal use. The private wing is recessed and dense, positioning labs and housing. Both sandwich the courtyard, using it as an orienting core that organizes movement and sets up continuous views across ponds, planting, and enclosures."}]},{"folios":[["8",2.2],["9",96.2]],"items":[{"fig":"f08","x":0,"y":2,"w":50,"h":88,"fit":"cover","alt":"Aviary view"},{"t":"cap","x":3,"y":92,"w":30,"size":0.95,"txt":"05. Aviary View"},{"fig":"f06","x":51,"y":10,"w":46,"h":34,"alt":"Longitudinal section"},{"fig":"f07","x":51,"y":53,"w":40,"h":28,"alt":"Cross section"},{"t":"cap","x":51.5,"y":5,"w":10,"size":0.95,"txt":"06."},{"t":"cap","x":51.5,"y":48,"w":10,"size":0.95,"txt":"07."},{"t":"cap","x":54,"y":86,"w":30,"size":0.95,"txt":"06. Longitudinal Section\n07. Cross Section"}]},{"folios":[["10",2.2],["11",96.2]],"items":[{"fig":"f09","x":3,"y":8,"w":47,"h":78,"alt":"Wall section and foundation detail"},{"t":"cap","x":3,"y":88,"w":34,"size":0.95,"txt":"08. Wall Section and Foundation Detail"},{"fig":"f10","x":52,"y":9,"w":46,"h":56,"alt":"Structural axonometric"},{"t":"body","x":52,"y":66,"w":21,"size":1.05,"txt":"The detached roof acts as a protective canopy, shading the rooms below while allowing air to circulate freely between the two layers, reducing heat gain and promoting passive cooling through natural ventilation. With prevailing winds arriving from the south, the wood slat walls work in concert with the angled roof, acting simultaneously as a shading device and a temperature moderator."},{"t":"body","x":76,"y":66,"w":21,"size":1.05,"txt":"Finally, the roof ties the rooms together as a campus; its angled planes frame views toward the aviary and the surrounding landscape, fostering a sense of connection and collaboration among all users, and grounding a space underneath where all parties can converge."},{"t":"cap","x":52,"y":91,"w":34,"size":0.95,"txt":"09. Structural Axonometric"}]},{"single":true,"folios":[["12",2.2],["13",96.8]],"items":[{"fig":"f11","x":0,"y":0,"w":100,"h":100,"fit":"cover","alt":"Exterior view from the coast"},{"t":"cap","x":3,"y":91,"w":40,"size":0.95,"light":true,"txt":"10. Exterior View from the Coast"}]}]},{"id":"eieio","num":"02","name":"EIEIO","location":"Sunset District, San Francisco, California","professor":"Andrew Colopy","year":"Spring 2025","collections":["projects"],"peek":["e22","e16","e06c","e07c","e20","e08c","e17","e21","e15","e23","e13","e18","e19"],"info":{"date":"Spring 2025","collaborators":"Ryan Carlton, Amelia Vasquez","professor":"Andrew Colopy","institution":"Rice University"},"spreads":[{"single":true,"folios":[["14",5.2],["15",94.3]],"items":[{"t":"h1","x":5,"y":11.5,"w":42,"align":"center","size":2.5,"txt":"EIEIO"},{"t":"sub","x":5,"y":16,"w":42,"align":"center","size":1.2,"txt":"Sunset District, San Francisco, California"},{"t":"num","x":5.2,"y":23,"size":5.0,"txt":"02"},{"t":"meta","x":5.2,"y":31,"w":24,"size":1.0,"txt":"Professor: Andrew Colopy\nCollaborators: Ryan Carlton, Amelia Vasquez\nYear: Spring 2025"},{"t":"body","x":5.2,"y":50,"w":19.5,"size":0.95,"txt":"Our project begins by mapping San Francisco's existing landscape of institutional and cultural programs that support social development across age, cultural, and economic groups. Through the Existing Institutional Map, we questioned whether their current distribution sustains social space at an equitably accessible neighborhood scale. To argue for redistribution, we examined the transit network and reconsidered how roadway utility could support new zoning while accommodating increased density. This led to a reconfiguration of transit that reduces roadways in favor of greenways and expands vertical public transit lines, strengthening cross connections typically secondary to car movement."},{"t":"cap","x":25.4,"y":23.5,"w":8,"size":0.9,"txt":"01."},{"fig":"e01","x":26.9,"y":24,"w":19.6,"h":64,"alt":"Facade dithering study"},{"t":"cap","x":6.5,"y":89,"w":28,"size":0.95,"txt":"01. Facade Dithering"},{"fig":"e02","x":49.2,"y":4.5,"w":47.2,"h":91,"fit":"cover","alt":"Site development plan"},{"t":"cap","x":66,"y":93,"w":26,"align":"right","size":0.95,"txt":"02. Site Development"}]},{"single":true,"folios":[["16",4.5],["17",93.5]],"items":[{"t":"cap","x":5.5,"y":14,"w":8,"size":0.9,"txt":"03."},{"fig":"e03","x":6.4,"y":14.8,"w":37.4,"h":36,"alt":"Program massing and unit distribution"},{"t":"body","x":8.75,"y":57,"w":38,"size":0.85,"txt":"From these infrastructural shifts, we developed an adjacency based zoning logic informed by roadways, public service lines, and greenways, with a simple objective: every inhabitant is within walking distance of a social program, or a short walk to transit that leads to one. At the district scale, this organizes programs along transportation networks, promoting equal access and informal interaction. Once stratified, relationships between institutional nodes and public space become legible, with institutional programs paired to proportional green space so densification coincides with a densification of public life. These nodes are stitched together by a horizontal greenway network that supports pedestrian movement and establishes a hierarchy of green spaces. As the network consolidates, typologies open up, micro neighborhoods emerge, and courtyards become essential rather than residual. Through zoning iterations and massing studies, the project narrows to a selected site and tests greenways and courtyards as a continuous social armature. The conventional podium is deliberately blurred, with the first two levels served by the greenway to complicate street level and extend public access above grade, making the social spine readable, accessible, and continuous with the district's pedestrian infrastructure."},{"t":"cap","x":8.75,"y":87.5,"w":30,"size":0.95,"txt":"03. Program Massing"},{"t":"cap","x":53,"y":14,"w":8,"size":0.9,"txt":"04."},{"fig":"e04","x":57.5,"y":13.2,"w":31.6,"h":66.6,"alt":"Preliminary distribution studies"},{"t":"cap","x":53,"y":87.5,"w":32,"size":0.95,"txt":"04. Preliminary Distributions"}]},{"single":true,"folios":[["18",3.2],["19",96.8]],"items":[{"t":"cap","x":5.4,"y":7,"w":8,"size":0.9,"txt":"05."},{"fig":"e05","x":5.4,"y":16,"w":89.8,"h":62,"alt":"Facade breakdown across four elevations"},{"t":"cap","x":5.4,"y":88,"w":30,"size":0.95,"txt":"05. Facade Breakdown"}],"ratio":"2000/880"},{"single":true,"folios":[["20",5.4],["21",93.5]],"items":[{"t":"cap","x":5.75,"y":16.5,"w":8,"size":0.9,"txt":"06."},{"fig":"e06","x":11.4,"y":18,"w":75.1,"h":25.6,"alt":"Longitudinal section"},{"t":"cap","x":5.75,"y":47.5,"w":8,"size":0.9,"txt":"07."},{"fig":"e07","x":13,"y":50.2,"w":33.25,"h":22,"alt":"Cross section"},{"t":"body","x":56.75,"y":48,"w":33.25,"size":0.8,"txt":"The building's organization reinforces hierarchy through vertical bars that blur the spine into five parallel site-wide bars. This logic draws people from greenways into courtyards, allowing them to function as civic pockets rather than private voids. Sections through the spine reveal an intended ambiguity between interior and exterior, with the spine as a porous condition negotiating the building's edges and internal social space. Porosity is reinforced through structural and egress planning: a fluid second floor enables continuous courtyard movement, with public retail in the spine and adjacent space for offices. Column geometry, balconies, lobbies, and double-loaded corridors remain legible while supporting social overlap, and egress aligns with layered publicness, moving through courtyards before descending to reinforce the courtyard network as infrastructural rather than decorative."},{"t":"body","x":56.75,"y":71,"w":33.25,"size":0.8,"txt":"Wood treatment recesses the spine, letting horizontal bars read in relief and clarifying wayfinding, while diffused pressure treated wood and deliberate ambiguity position the building as secondary to the greenway and retail experience. Curtain walls shift in color inward, with black-stained residential units receding into tinted glazing. Across podium and residential levels, curtain wall, aluminum, and redwood panels finished in clear or black stain dissolve scale and soften boundaries between greenways and social programs, maintaining transparency. Continuity intensifies in the residential courtyard, where porosity enables access and visibility, and interior and exterior spaces, from greenway to podium, plaza, courtyard, and balcony, bleed into one another, intentionally blurring connections through the building."},{"t":"cap","x":5.75,"y":83,"w":30,"size":0.95,"txt":"06. Longitudinal Section\n07. Cross Section"}]},{"single":true,"folios":[["22",4.4],["23",93.5]],"items":[{"fig":"e08","x":4.25,"y":12,"w":41,"h":71,"alt":"Plans and building elevation"},{"t":"cap","x":4.4,"y":88.6,"w":30,"size":0.95,"txt":"08. Plans"},{"t":"cap","x":54.5,"y":11.2,"w":8,"size":0.9,"txt":"09."},{"fig":"e09","x":62.25,"y":10.8,"w":23,"h":73.4,"alt":"Wall section and details"},{"t":"cap","x":54.5,"y":88.6,"w":32,"size":0.95,"txt":"09. Wall Section and Details"}]},{"single":true,"folios":[["24",3.9],["25",92.3]],"items":[{"t":"body","x":4.25,"y":17,"w":22,"size":0.75,"txt":"At the unit scale, the project reframes domestic life through a gradient of shared space across typologies. Traditional units follow a service bar to living bar logic, while collective units emphasize flexibility and a recalibrated social contract that reduces reliance on operable doors and increases contribution to shared space. As units scale from one to four bedrooms, shared conditions intensify through internal thresholds, balconies, and shared storage, varying public and private readings. Walnut sliding doors mark moments of exchange, while privacy is maintained through window placement and ambiguous unit boundaries, proposing a social contract based on invitation and movement between collective and private space."},{"t":"body","x":4.25,"y":45,"w":22,"size":0.75,"txt":"Environmental systems reinforce permeability and seasonal adaptability. A longitudinal section shows how linear unit bars scale into building organization and reveals courtyard chimneys that enable natural ventilation. In temperate seasons, fresh air enters through operable windows while south facing glazed chimneys with masonry thermal mass generate draft."},{"t":"body","x":4.25,"y":62,"w":22,"size":0.75,"txt":"The chimney connects to a plenum and ducts serving each unit, allowing consistent operation across the residential field. In winter, warmer air is drawn from above the building while the chimney plenum is closed to redirect heat into units and ventilate through windows. Environmental studies indicate moderate annual dry bulb temperatures, supporting extended use of the solar chimney and aligning environmental performance with the project's broader aim to integrate access, social exchange, and comfort."},{"t":"cap","x":27.5,"y":56,"w":8,"size":0.9,"txt":"10."},{"fig":"e10","x":29.5,"y":8,"w":54,"h":76,"alt":"Half court vignette"},{"fig":"e11","x":87,"y":38,"w":11,"h":9,"alt":"Natural ventilation during colder seasons"},{"t":"cap","x":83.5,"y":48,"w":8,"size":0.9,"txt":"11."},{"fig":"e12","x":87,"y":58,"w":11,"h":10,"alt":"Natural ventilation during warmer seasons"},{"t":"cap","x":83.5,"y":69.5,"w":8,"size":0.9,"txt":"12."},{"t":"cap","x":52,"y":87,"w":32,"size":0.95,"txt":"10. Half Court Vignette\n11. Natural Ventilation During Colder Seasons\n12. Natural Ventilation During Warmer Seasons"}]}]},{"id":"interstitial-space","num":"03","name":"Interstitial Space - Texas A&M University Visitor Center","location":"College Station, Texas","professor":"Marcel Erminy","year":"Fall 2023","collections":["projects"],"peek":["i25","i30","i31","i32","i24","i33","i26","i29","i22","i27","i28"],"info":{"date":"Fall 2023","collaborators":"Jun Lee","professor":"Marcel Erminy","institution":"Texas A&M University"},"spreads":[{"single":true,"folios":[["26",2.8],["27",95]],"items":[{"t":"h1","x":13,"y":7.5,"w":35,"align":"center","size":2.3,"txt":"INTERSTITIAL SPACE"},{"t":"sub","x":13,"y":12,"w":35,"align":"center","size":1.15,"txt":"Texas A&M University Visitor Center"},{"t":"num","x":2.8,"y":19,"size":5.0,"txt":"03"},{"t":"meta","x":2.8,"y":28.5,"w":13.5,"size":0.72,"txt":"Professor: Marcel Erminy\nCollaborators: Junseok Lee\nYear: Fall 2023\nContribution: Design, Research, Structure, Drawings, Digital Modelling, Rendering, Post Production, Physical Model"},{"t":"body","x":2.8,"y":46,"w":13.5,"size":0.72,"txt":"Texas A&M University has been subjugated to the dramatic influx of student body throughout its lifespan resulting in urban sprawl and infrastructural development. Unfortunately, the reliance on motor transportation over the human scale has caused a lack of intentional development of the interstitial spaces between built environments. These spaces are important because they are the brief moments of unpredictable interaction that create a community and ultimately create a shared identity, which is what A&M strives to achieve on campus. Ultimately, this lack of interstitial spaces that benefit the community leads to a scarcity of cultural discourse between prospecting, current, and former students."},{"fig":"i01","x":16.5,"y":19.2,"w":31.3,"h":66,"alt":"Activation mapping"},{"t":"cap","x":4,"y":92,"w":26,"size":0.9,"txt":"01. Activation Mapping"},{"fig":"i02","x":50,"y":0,"w":50,"h":100,"fit":"cover","alt":"Facade render of office space"}]},{"single":true,"folios":[["28",2.8],["29",95]],"items":[{"fig":"i03","x":0,"y":2,"w":50.5,"h":39,"alt":"Site plan of new addition"},{"fig":"i04","x":4,"y":43,"w":26,"h":33,"alt":"Section chunk through truss, atrium and auditorium"},{"fig":"i05","x":31,"y":42.5,"w":17,"h":33.5,"alt":"Worm's eye view of circulation path"},{"t":"body","x":4.4,"y":78,"w":42,"size":0.78,"txt":"Our proposal for The Aggieland Visitor Center aims to create an environment that promotes social engagement, collaboration, and a sense of belongingness among all users. We plan this to happen by activating these interstitial spaces defined earlier. Once activated, these spaces allow the interaction between visitors and students to take place allowing the visitors to see what it truly means to be part of the Aggie community."},{"t":"cap","x":4.4,"y":88,"w":38,"size":0.85,"txt":"03. Site Plan of New Addition to the Main Campus\n04. Section Chunk Through the Truss, Atrium and Auditorium\n05. Worm's Eye View of Circulation Path"},{"fig":"i06","x":57.8,"y":7.5,"w":18.2,"h":76,"alt":"Section through egress stairs, truss and sunken plaza"},{"fig":"i07","x":82.8,"y":9.5,"w":15.7,"h":25.5,"alt":"Plus one floor plan"},{"fig":"i08","x":82.8,"y":43,"w":15.7,"h":21,"alt":"Ground floor plan"},{"fig":"i09","x":82.8,"y":65,"w":15.7,"h":19.5,"alt":"Minus one floor plan"},{"t":"cap","x":54.5,"y":88,"w":34,"size":0.85,"txt":"06. Section Through Egress Stairs, Truss and Sunken Plaza\n07. +1 Floor\n08. 0 Floor\n09. -1 Floor"}]},{"single":true,"folios":[["30",2.8],["31",95]],"items":[{"fig":"i10","x":3,"y":10,"w":45,"h":19,"alt":"Physical structure model"},{"t":"body","x":4.4,"y":32,"w":20,"size":0.75,"txt":"The activation of the interstitial spaces within our site will be done through our driving design element: the truss. The truss serves as a conduit for bringing programmatic elements within and a canopy that shapes the interstitial environment underneath. The cantilevering of the truss ultimately blends the transition point, the edge, of campus and our context, playing in part with our plaza to ease our users into our space with full coverage, protection, and integrity from the"},{"t":"body","x":26.5,"y":32,"w":20,"size":0.75,"txt":"natural elements, such as the summer sun or showers in the spring. Attached to the truss is the mesh skin which serves as a mediary element that diffuses the material transition from the steel truss to the cement fiber facade. Present mainly on the Welborn-facing facades, the mesh provides coverage from noise pollution, and solar radiation, and lowers facade temperatures."},{"fig":"i11","x":4.2,"y":58,"w":43.6,"h":28,"alt":"Truss render depicting levels of engagement"},{"t":"cap","x":4.4,"y":89,"w":34,"size":0.85,"txt":"10. Physical Structure Model\n11. Truss Render Depicting Levels of Engagement"},{"fig":"i12","x":52.8,"y":8.5,"w":20.2,"h":74.5,"alt":"Exploded axonometric"},{"fig":"i13","x":71.2,"y":8.8,"w":26.8,"h":38,"alt":"Structural detail diagram of skin mesh to facade"},{"fig":"i14","x":74,"y":52,"w":24,"h":14,"alt":"Ceiling systems"},{"fig":"i15","x":74,"y":66,"w":24,"h":15.5,"alt":"Slab system"},{"t":"cap","x":54,"y":86,"w":34,"size":0.85,"txt":"12. Exploded Axonometric\n13. Structural Detail Diagram of Skin Mesh to Facade\n14. Ceiling Systems — Chilled Beams // Dedicated Outside Air System\n15. Slab System — Under-Floor Heating"}]},{"single":true,"items":[{"fig":"i16","x":0,"y":0,"w":100,"h":100,"fit":"cover","alt":"Exterior storm setting"},{"t":"cap","x":70,"y":93,"w":28,"align":"right","size":0.9,"light":true,"txt":"16. Exterior Storm Setting"}]},{"single":true,"folios":[["34",2.8]],"items":[{"fig":"i17","x":2,"y":6,"w":48,"h":61,"alt":"Section chunk of relationship between floors"},{"t":"body","x":4.4,"y":70,"w":21,"size":0.7,"txt":"The open layout on each floor caters to user capacity, fostering a balance between spatial design and user experience. Through the ascension of the levels, there's a deliberate increase in space density, promoting a more intimate and engaging interaction among users. This design approach creates an active environment, creating seamless transitions between the semi-private and social engagement across floors. The truss cantilevers create a canopy over the sunken plaza. This overarching structure"},{"t":"body","x":27,"y":70,"w":21,"size":0.7,"txt":"helps imply this space between the interior and the exterior. Three components come together to activate the plaza: the space itself, the canopy provided by the truss, the shading structure, and vegetation, and the program from the visitor center and the cafe. This open plaza allows the user to pause and engage with their surroundings including the people, thus fostering a sense of connection and collaboration among all users, and grounds a space underneath where all parties can converge."},{"t":"cap","x":4.4,"y":91,"w":34,"size":0.85,"txt":"17. Section Chunk of Relationship Between Floors"},{"fig":"i18","x":50,"y":0,"w":50,"h":100,"fit":"cover","alt":"Exterior render off Wellborn Road"},{"t":"cap","x":70,"y":93,"w":28,"align":"right","size":0.9,"light":true,"txt":"18. Exterior Render Off Wellborn Rd"}]}]},{"id":"within-the-scape","num":"04","name":"Within the Scape","location":"Redefining The Landscape","professor":"Patrick Danahy, Gabriel Esquivel","year":"Spring 2022","collections":["projects"],"peek":["w22","w20","w21","w23","w24","w25"],"info":{"date":"Spring 2022","collaborators":"Maya Rubio, Riley Wemhoener, Raul Basualdo","professor":"Patrick Danahy, Gabriel Esquivel","institution":"Texas A&M University"},"spreads":[{"single":true,"folios":[["36",2.6],["37",95]],"items":[{"t":"h1","x":13,"y":7.5,"w":35,"align":"center","size":2.3,"txt":"WITHIN THE SCAPE"},{"t":"sub","x":13,"y":12,"w":35,"align":"center","size":1.15,"txt":"Redefining The Landscape"},{"t":"num","x":2.6,"y":19,"size":5.0,"txt":"04"},{"t":"meta","x":2.6,"y":27,"w":16,"size":0.68,"txt":"Professors: Patrick Danahy, Gabriel Esquivel\nCollaborators: Armando Basualdo, Maya Rubio, Riley Wemhoener, Kalle Bentson\nYear: Spring 2022\nContribution: Design, Research, Drawings, Digital Modelling, Post Production, Physical Model"},{"t":"cap","x":19.5,"y":43,"w":8,"size":0.85,"txt":"01."},{"fig":"w01","x":2.6,"y":45,"w":17.5,"h":33,"alt":"Facade detail of deterioration by vegetative growth"},{"t":"body","x":21,"y":45,"w":13.5,"size":0.66,"txt":"The figure's interior relates to the external context, continuing the material hierarchy. Organic matter disrupts human-imposed order, reflecting a shift to biochemical surface and messy self-organization. This growth originates from an anthropocentric perspective of nature, as the form was intended as an exhibition of idealized natural growth. Human-imposed control establishes a display area for the highly romanticized picturesque growth humans often associate with nature."},{"t":"body","x":35.2,"y":45,"w":13.5,"size":0.66,"txt":"Human absence led to natural growth that often looks unfamiliar to our idealized vision of nature. While human influence is still somewhat recognizable, the imposition of control on nature is not intended to serve them. A formal organization no longer designates spatial zones; instead, microbiomes operate as an ecology of parts. A destroyed organization's remains lay scattered amidst rubble and trash, with human-made machinery left behind and isolated. These pristine, entirely anthropocentric elements are impenetrable, and their isolation produces a sterile environment."},{"t":"cap","x":4,"y":86.5,"w":32,"size":0.85,"txt":"01. Facade Detail of the Deterioration by Vegetative Growth"},{"fig":"w02","x":50,"y":0,"w":50,"h":100,"fit":"cover","alt":"Atmospheric figure render"},{"t":"cap","x":67,"y":93,"w":25,"align":"right","size":0.9,"light":true,"txt":"02. Atmospheric Figure Render"}]},{"single":true,"folios":[["38",2.6],["39",95]],"items":[{"fig":"w03","x":9.5,"y":9.5,"w":32,"h":74,"alt":"Section chunk through vegetation and human imposition"},{"t":"cap","x":4,"y":87,"w":36,"size":0.85,"txt":"03. Section Chunk Through the Unfamilair Vegetation and Human Imposition\n04. Elevation Close Up"},{"t":"body","x":51,"y":10,"w":18,"size":0.68,"txt":"Both the unfamiliar vegetation and the lack of organic matter on machine parts, detail different outcomes of attempts to control nature. The first fights back against the imposed control to self-organize, and the second is so overly controlled that nature ceases to exist in that biome. The transitions between each microbiome and the variety of growth that occurs outline the shift from an anthropocentric focus, with heavy inorganic machinery, to a biochemical active surface, with self-organizing organic matter. The lack of picturesque growth emphasizes the human desire to display their romanticized view of nature. The relationship between figure and ground is reiterated in the interior by posing the question:"},{"t":"h1","x":51,"y":50,"w":18,"size":0.72,"txt":"What constitutes a landscape?"},{"t":"body","x":51,"y":55,"w":18,"size":0.68,"txt":"Landscapes are normally thought of as being horizontal planes with a variety of vegetation operating as an ecosystem. Since our object's form is ambiguous from the ground, the figure itself can be perceived as ground, and the vertical growth and natural wilds that self-organize throughout the interior could be considered a landscape. The multitude of microbiomes each constitute a part of the interior and the ecology of parts, interrelated to one another, produce an ecosystem. Natural elements are decontextualized and reorganized for self-organization, and human control causes transition from natural growth to pristine machinery, resulting in diverse vegetation through self-organization."},{"t":"cap","x":69.5,"y":6,"w":8,"size":0.85,"txt":"04."},{"fig":"w04","x":72,"y":8.5,"w":26.5,"h":86,"alt":"Elevation close up"}]},{"single":true,"dark":true,"folios":[["40",2.6],["41",95]],"items":[{"t":"cap","x":4,"y":7.5,"w":8,"size":0.85,"txt":"05."},{"fig":"w05","x":13.5,"y":9,"w":23.5,"h":76,"alt":"Section of the ecological narrative within the form"},{"t":"cap","x":4,"y":88,"w":34,"size":0.85,"txt":"05. Section of the Ecological Narrative Within the form"},{"t":"cap","x":59,"y":7.5,"w":8,"size":0.85,"txt":"06."},{"fig":"w06","x":63,"y":9.5,"w":27,"h":33,"alt":"Plan view of organic overtake of inorganic machinery"},{"t":"cap","x":59,"y":47.5,"w":8,"size":0.85,"txt":"07."},{"fig":"w07","x":63,"y":50,"w":27,"h":34,"alt":"Plan view of self-organizing organic matter"},{"t":"cap","x":54,"y":88,"w":38,"size":0.85,"txt":"06. Plan View of Organic Overtake of Inorganic Machinery\n07. Plan View of Self-Organizing Organic Matter"}]}]},{"id":"please-flash-photography","num":"07","name":"Please, Flash Photography","location":"Archi - Arts Installation: Distortion","professor":"","year":"2026","collections":["installations"],"peek":["aa02","aa10","aa11","aa01","aa03","aa04","aa05","aa06","aa07","aa08","aa09"],"info":{"date":"Spring 2026","location":"Houston, Texas","collaborators":"Yousif Giyo, Ryan Carlton","institution":"Rice University"}},{"id":"trillium","num":"05","name":"Trillium","location":"Bethel Woods Art & Architecture Festival: Peace Rises","professor":"","year":"2025","collections":["installations"],"peek":["t30","t31","t32","t33","t34","t35","t36","t37","t38","t39"],"info":{"date":"Fall 2025","location":"Bethel, New York","collaborators":"Shaelyn Parker, Jingping Wu, Grace Andrews, Alex Pina, Braden Birko, Manuella Gbossou, Benjamin Roa","professor":"Chris Humphrey","institution":"Rice University"},"spreads":[{"single":true,"folios":[["43",95]],"items":[{"t":"h1","x":13,"y":8,"w":35,"align":"center","size":2.3,"txt":"2025 BUILDFEST"},{"t":"sub","x":13,"y":12.5,"w":35,"align":"center","size":1.15,"txt":"Bethel Woods Art & Architecture Festival:\nPeace Rises"},{"t":"num","x":2.8,"y":20,"size":5.0,"txt":"05"},{"t":"meta","x":2.8,"y":29,"w":16,"size":0.75,"txt":"Year: 2025\nCollaborators: Alex Pina, Manuella Gbossou, Jim (Jingping) Wu, Shaelyn Parker, Grace Andrews, Benjamin Rao, Braden Birko"},{"fig":"t01","x":2.7,"y":44.3,"w":27.3,"h":48.7,"alt":"Pavilion beside the shuttle stop"},{"fig":"t02","x":30.7,"y":44.3,"w":15.8,"h":17,"alt":"Design drawings"},{"fig":"t03","x":30.7,"y":62.3,"w":15.8,"h":16.5,"alt":"Raising the frame"},{"fig":"t04","x":30.7,"y":79.8,"w":15.8,"h":16.5,"alt":"Members laid out on the field"},{"fig":"t05","x":53,"y":2,"w":19.5,"h":20,"alt":"Driving the joinery home"},{"fig":"t06","x":53,"y":23.5,"w":19.5,"h":39,"alt":"Translucent red petal detail"},{"fig":"t08","x":53,"y":64,"w":19.5,"h":12.5,"alt":"Reclaimed wood siding detail"},{"fig":"t09","x":53,"y":78,"w":19.5,"h":18.5,"alt":"The build team"},{"t":"body","x":76,"y":2,"w":21.5,"size":0.66,"txt":"Trillium draws formal and conceptual inspiration from the Trillium flower, associated with renewal and transformation. Echoing the flower's morphology, the pavilion unfolds as a translucent red petal, inviting engagement with light, material, and memory, evoking the ephemerality of nature and the countercultural spirit of Woodstock's “flower power.” Central to the project is an investigation of rebirth not only as metaphor, but as material methodology. Extending research into computational design of waste based material assemblies, the pavilion employs reclaimed wood and post industrial plastic. Its structural system adapts traditional timber joinery through fabrication to accommodate the irregularities of salvaged stock. Recycled plastic panels are milled to seat within grooves of reclaimed wood siding, forming a translucent envelope that captures and refracts sunlight. The result is a luminous, contemplative space, a material articulation of peace rooted in cycles of reuse and renewal."},{"fig":"t07","x":76,"y":37,"w":19.5,"h":19,"alt":"Assembly in the field"},{"fig":"t10","x":76,"y":57.5,"w":19.5,"h":39,"alt":"The completed pavilion"}]}]},{"id":"freedom-by-design","num":"06","name":"Freedom by Design","location":"Installation Extravaganza","professor":"","year":"2022","collections":["installations"],"peek":["d02","d04","d05","d06","d07","d08"],"info":{"date":"Fall 2022","location":"College Station, Texas","collaborators":"Shelby Rajski","institution":"AIAS Freedom by Design"},"spreads":[{"single":true,"folios":[["44",2.2],["45",95]],"items":[{"t":"h1","x":10,"y":8,"w":38,"align":"center","size":2.3,"txt":"FREEDOM BY DESIGN"},{"t":"sub","x":10,"y":12.5,"w":38,"align":"center","size":1.15,"txt":"Installation Extravaganza"},{"t":"num","x":2.8,"y":20,"size":5.0,"txt":"06"},{"t":"meta","x":2.8,"y":29,"w":18,"size":0.8,"txt":"Year: 2022\nPhotographer: Junseok Lee"},{"t":"body","x":4.4,"y":34,"w":22,"size":0.72,"txt":"Freedom by Design Installation Extravaganza was an event dedicated to revitalizing the vacant space underneath Langford's A bridge. In this endeavor, I assumed a leadership role and was responsible for organizing and supervising the fabrication of seating on the first level of Langford A. The project was a collaborative effort involving the school and the architectural community to transform a neglected area into a functional space for studying and recreational events. Our team worked diligently to create an environment that would benefit and be appreciated by all who traversed it. The project's success was a testament to the dedication and hard work of all involved."},{"fig":"d01","x":30.7,"y":30.5,"w":17.1,"h":22,"alt":"Seating axonometric"},{"fig":"d02","x":2.7,"y":60,"w":45.3,"h":36,"alt":"Laying the composite decking"},{"fig":"d03","x":53,"y":2,"w":40,"h":38,"alt":"Construction details"},{"fig":"d04","x":53.2,"y":41,"w":19.1,"h":17.8,"alt":"Fixing a board"},{"fig":"d05","x":73.5,"y":41,"w":19.5,"h":31.5,"alt":"Carrying the bench into place"},{"fig":"d06","x":55.2,"y":60,"w":17.1,"h":17.5,"alt":"Underside of the bridge"},{"fig":"d07","x":55.2,"y":78.5,"w":17.1,"h":17.5,"alt":"Working on the steps"},{"fig":"d08","x":73.5,"y":74,"w":19.5,"h":22,"alt":"The finished seating in use"}]}]}],"about":{"sections":[{"title":"About","body":["I am currently pursuing a Master of Architecture at Rice University and earned a Bachelor of Environmental Design with a minor in Sustainable Architecture & Planning from Texas A&M University."]},{"title":"Digital Software Skills","body":["Adobe Creative Cloud, AutoCAD, Revit, SketchUp, 3ds Max, SideFX Houdini, V-Ray, Chaos Corona, KeyShot, D5 Render, Enscape, Lumion"]},{"title":"Fabrication Skills","body":["3D Printing, ZUND Cutting, Wood Shop (Industrial and Handheld Power Tools), Resin Casting, Plaster Casting"]},{"title":"Awards & Honors","list":["Mexico City Global Workshop | Summer 2026","Archi - Arts Proposal | Spring 2026","Summer Travel Fellowship | Spring 2025","College of Architecture Student Scholarship | Spring 2025","AXIOM Student Publication | 2022, 2024","George Bush Foundation Undergraduate Scholarship | 2022, 2024","Study Abroad Fellowship | Fall 2023","William E. Nash ’36 Endowment | Fall 2023","Joe & Sherrye Bass SABR Scholarship | Spring 2023","Fresh Vision II, Wright Gallery Exhibition | Spring 2023"]}]},"experience":[{"title":"Education","entries":[{"period":"2024 – 2026","role":"Master of Architecture, Candidate","org":"Rice University, Houston"},{"period":"2020 – 2024","role":"Bachelor of Environmental Design","org":"Texas A&M University","minor":"Minor in Sustainable Architecture and Planning"}]},{"title":"Experience","entries":[{"period":"Jan 2026 – Present","role":"Digital Research Assistant","org":"Rice School of Architecture"},{"period":"Aug 2024 – Present","role":"Graduate Assistant","org":"Rice School of Architecture"},{"period":"Dec 2025 – Aug 2026","role":"Research Assistant","org":"Rice School of Architecture"},{"period":"Jan 2026 – Present","role":"Operations Assistant","org":"Rice University"},{"period":"May 2024 – Aug 2024","role":"Architectural Intern","org":"Perkins Eastman, Dallas"},{"period":"May 2023 – May 2024","role":"Freedom by Design Chair","org":"AIAS, Texas A&M University"},{"period":"Aug 2023 – May 2024","role":"Marketing Officer","org":"AIAS, Texas A&M University"},{"period":"Sep 2023 – Apr 2024","role":"Volunteer Support Assistant","org":"Habitat for Humanity, Bryan, Texas"},{"period":"Dec 2021 – Jan 2022","role":"Teaching Assistant","org":"Kyushu University, LSPA Winter School"}]}],"contact":{"email":"fatimaiiicastro@gmail.com","linkedin":"https://www.linkedin.com/in/fatineux/"},"front":[{"single":true,"items":[{"t":"sw","x":0,"y":36,"w":100,"align":"center","size":5.0,"txt":"Selected Works"},{"t":"label","x":0,"y":50.5,"w":100,"align":"center","size":1.5,"txt":"Architecture Portfolio"},{"t":"label","x":0,"y":55,"w":100,"align":"center","size":1.5,"txt":"2026"},{"t":"label","x":0,"y":63,"w":100,"align":"center","size":1.35,"txt":"B.Env.D, Texas A&M 2024\nM.Arch, Rice 2026"}]},{"single":true,"folios":[["2",2.2],["3",96.8]],"items":[{"t":"ctitle","x":8.5,"y":7.5,"size":1.3,"txt":"CONTENTS"},{"t":"cnum","x":8.5,"y":17.0,"size":4.0,"txt":"01"},{"t":"centry","x":21.5,"y":18.0,"w":34,"size":1.25,"txt":"BIODIVERSITY RESEARCH CENTER"},{"t":"csub","x":21.5,"y":21.2,"w":34,"size":1.25,"txt":"ARCH 602"},{"t":"cnum","x":8.5,"y":29.6,"size":4.0,"txt":"02"},{"t":"centry","x":21.5,"y":30.6,"w":34,"size":1.25,"txt":"EIEIO"},{"t":"csub","x":21.5,"y":33.800000000000004,"w":34,"size":1.25,"txt":"ARCH 601"},{"t":"cnum","x":8.5,"y":42.2,"size":4.0,"txt":"03"},{"t":"centry","x":21.5,"y":43.2,"w":34,"size":1.25,"txt":"INTERSTITIAL SPACE"},{"t":"csub","x":21.5,"y":46.400000000000006,"w":34,"size":1.25,"txt":"ARCH 405"},{"t":"cnum","x":8.5,"y":54.8,"size":4.0,"txt":"04"},{"t":"centry","x":21.5,"y":55.8,"w":34,"size":1.25,"txt":"WITHIN THE SCAPE"},{"t":"csub","x":21.5,"y":59.0,"w":34,"size":1.25,"txt":"ARCH 206"},{"t":"cnum","x":8.5,"y":67.4,"size":4.0,"txt":"05"},{"t":"centry","x":21.5,"y":68.4,"w":34,"size":1.25,"txt":"TRILLIUM"},{"t":"csub","x":21.5,"y":71.60000000000001,"w":34,"size":1.25,"txt":"2025 BUILDFEST"},{"t":"cnum","x":8.5,"y":80.0,"size":4.0,"txt":"06"},{"t":"centry","x":21.5,"y":81.0,"w":34,"size":1.25,"txt":"FREEDOM BY DESIGN"},{"t":"csub","x":21.5,"y":84.2,"w":34,"size":1.25,"txt":"AIAS"}]}]};

const IMG        = DATA.images;
const FRONT      = DATA.front;
const PROJECTS   = DATA.projects;
const ABOUT      = DATA.about;
const EXPERIENCE = DATA.experience;
const CONTACT    = DATA.contact;

/* Portfolio is the full body of work. Projects and Installations are the two
   curated cuts of it, and a project belongs to exactly one of them. */
const CAROUSELS = ['projects','installations'];
const COLLECTIONS = { projects: [], installations: [], portfolio: [] };
for (const p of PROJECTS) {
  COLLECTIONS.portfolio.push(p.id);
  for (const c of CAROUSELS) if (p.collections.includes(c)) COLLECTIONS[c].push(p.id);
}
const BY_ID = Object.fromEntries(PROJECTS.map(p => [p.id, p]));

const INFO_FIELDS = [
  ['date','Date'], ['location','Location'], ['collaborators','Collaborators'],
  ['type','Type'], ['status','Status'],
  ['professor','Professor'], ['institution','Institution'], ['client','Client'],
  ['area','Area'], ['builder','Builder'], ['photography','Photography']
];

const ROUTES = ['projects','installations','portfolio','experience','about'];
const ARROW_L = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><line x1="21" y1="12" x2="4" y2="12"/><polyline points="10.5,5.5 4,12 10.5,18.5"/></svg>';
const ARROW_R = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><line x1="3" y1="12" x2="20" y2="12"/><polyline points="13.5,5.5 20,12 13.5,18.5"/></svg>';

let current = null;
const main = document.getElementById('main');
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function routeFromHash(){
  const h = location.hash.replace(/^#\/?/,'').toLowerCase();
  return ROUTES.includes(h) ? h : 'projects';
}
function infoLines(p){
  return INFO_FIELDS.filter(([k]) => p.info && p.info[k])
    .map(([k,label]) => `<div>${esc(label)}: ${esc(p.info[k])}</div>`).join('');
}
function updateChrome(){
  document.querySelectorAll('.nav a').forEach(a=>{
    if(a.getAttribute('href').slice(2)===current) a.setAttribute('aria-current','page');
    else a.removeAttribute('aria-current');
  });
  document.querySelector('.about-link').classList.toggle('active', current==='about');
}

/* ---- Projects and Installations: a sneak peek carousel per project ---- */
function carouselHTML(collection){
  let html='';
  for(const pid of COLLECTIONS[collection]){
    const p = BY_ID[pid], total = p.peek.length, s = IMG[p.peek[0]];
    html += `<figure class="entry" data-pid="${pid}" data-i="0">`
         +  `<div class="stage">`
         +    `<div class="frame">`
         +      `<img src="${s.src}" data-w="${s.w}" data-h="${s.h}" alt="${esc(p.name)}, image 1 of ${total}">`
         +    `</div>`
         +    (total>1
                ? `<button class="arrow prev" type="button" aria-label="Previous image of ${esc(p.name)}">${ARROW_L}</button>`
                  + `<button class="arrow next" type="button" aria-label="Next image of ${esc(p.name)}">${ARROW_R}</button>`
                : '')
         +  `</div>`
         +  `<figcaption>`
         +    `<div class="counter">1 of ${total}</div>`
         +    `<div class="cap-name">${esc(p.name)}</div>`
         +    `<div>${esc(p.location)}</div>`
         +    `<div class="info" hidden>${infoLines(p)}</div>`
         +    `<div><button class="info-toggle" type="button" aria-expanded="false">Info</button></div>`
         +  `</figcaption>`
         +  `</figure>`;
  }
  return html;
}

/* ---- Portfolio: cover, then each project as composed spreads ---- */
function itemHTML(it){
  const pos = `left:${it.x}%;top:${it.y}%;`
            + (it.w != null ? `width:${it.w}%;`  : '')
            + (it.h != null ? `height:${it.h}%;` : '');
  if(it.fig){
    const im = IMG[it.fig];
    return `<img class="sp-img" style="${pos}object-fit:${it.fit||'contain'};object-position:center"`
         + ` src="${im.src}" loading="lazy" alt="${esc(it.alt||'')}">`;
  }
  const style = pos + (it.size ? `font-size:${it.size}cqw;` : '')
                    + (it.align ? `text-align:${it.align};` : '');
  const inner = it.t === 'legend'
    ? `<div class="sp-legend-t">${esc(it.title)}</div>`
      + it.items.map((t,i)=>`<div>${i+1}. ${esc(t)}</div>`).join('')
    : esc(it.txt).replace(/\n/g,'<br>');
  return `<div class="sp-item sp-${it.t}${it.light?' light':''}" style="${style}">${inner}</div>`;
}

function folioHTML(f, side){
  return `<div class="sp-item sp-folio" style="left:${side ? (f[1]-50)*2 : f[1]*2}%;`
       + `font-size:clamp(9px,1.7cqw,14px)">${esc(f[0])}</div>`;
}

function spreadHTML(sp){
  /* A single page runs the full width of the spread — used for the title,
     the contents and full-bleed plates. */
  if(sp.single){
    let h = `<div class="spread single"${sp.ratio?` style="--ar:${sp.ratio}"`:''}>`
          + `<div class="page${sp.dark?' dark':''}">`;
    for(const it of sp.items) h += itemHTML(it);
    if(sp.folios) for(const f of sp.folios)
      h += `<div class="sp-item sp-folio" style="left:${f[1]}%;font-size:clamp(9px,0.85cqw,14px)">${esc(f[0])}</div>`;
    return h + `</div></div>`;
  }
  /* Otherwise items are authored against the whole spread and remapped onto
     whichever page they fall on, so the pair stays stuck together. */
  const pages = [[],[]];
  for(const it of sp.items){
    const right = it.x >= 49.5;
    const o = Object.assign({}, it);
    o.x = right ? (it.x - 50) * 2 : it.x * 2;
    if(o.w != null) o.w = it.w * 2;
    if(o.size)     o.size = it.size * 2;
    pages[right ? 1 : 0].push(o);
  }
  return `<div class="spread">` + pages.map((items, side) => {
    let h = `<div class="page">`;
    for(const it of items) h += itemHTML(it);
    const f = (sp.folios||[])[side];
    if(f) h += folioHTML(f, side);
    return h + `</div>`;
  }).join('') + `</div>`;
}

function portfolioHTML(){
  let html = FRONT.map(spreadHTML).join('');
  for(const pid of COLLECTIONS.portfolio){
    for(const sp of (BY_ID[pid].spreads||[])) html += spreadHTML(sp);
  }
  return html;
}

function experienceHTML(){
  return `<div class="experience">` + EXPERIENCE.map(g =>
      `<section class="xp-group">`
    +   `<div class="xp-group-title">${esc(g.title)}</div>`
    +   g.entries.map(e =>
          `<div class="xp">`
        +   `<div>${esc(e.period)}</div>`
        +   `<div class="xp-role">${esc(e.role)}</div>`
        +   (e.minor ? `<div class="xp-role">${esc(e.minor)}</div>` : '')
        +   `<div>${esc(e.org)}</div>`
        + `</div>`).join('')
    + `</section>`).join('')
    + `<section class="xp-group">`
    +   `<div class="xp-group-title">Contact</div>`
    +   `<div class="xp">`
    +     `<div><a href="mailto:${CONTACT.email}">${esc(CONTACT.email)}</a></div>`
    +     `<div><a href="${CONTACT.linkedin}" target="_blank" rel="noopener">linkedin</a></div>`
    +   `</div>`
    + `</section>`
    + `</div>`;
}

function aboutHTML(){
  return `<div class="about-wrap"><div class="about-col">`
       + ABOUT.sections.map(sec =>
           `<section class="about-sec">`
         +   `<h2 class="about-h">${esc(sec.title)}</h2>`
         +   (sec.body || []).map(t => `<p>${esc(t)}</p>`).join('')
         +   ((sec.list || []).length
               ? `<div class="about-list">`
                 + sec.list.map(t => `<div>${esc(t)}</div>`).join('')
                 + `</div>`
               : '')
         + `</section>`).join('')
       + `</div></div>`;
}

/* Chrome legibility over black pages. Not a scroll effect on content —
   it only recolours the fixed corners, and it switches instantly. */
let darkObserver = null;
function watchDarkPages(){
  if(darkObserver){ darkObserver.disconnect(); darkObserver = null; }
  document.documentElement.classList.remove('on-dark');
  const darks = main.querySelectorAll('.page.dark');
  if(!darks.length) return;
  darkObserver = new IntersectionObserver(() => {
    let over = false;
    for(const d of darks){
      const r = d.getBoundingClientRect();
      if(r.top < innerHeight*0.5 && r.bottom > innerHeight*0.5) over = true;
    }
    document.documentElement.classList.toggle('on-dark', over);
  }, { threshold: [0, 0.01, 0.5, 0.99, 1], rootMargin: '0px' });
  darks.forEach(d => darkObserver.observe(d));
  addEventListener('scroll', onDarkScroll, { passive: true });
}
function onDarkScroll(){
  if(current !== 'portfolio'){ removeEventListener('scroll', onDarkScroll); return; }
  const darks = main.querySelectorAll('.page.dark');
  let over = false;
  for(const d of darks){
    const r = d.getBoundingClientRect();
    if(r.top < innerHeight*0.5 && r.bottom > innerHeight*0.5) over = true;
  }
  document.documentElement.classList.toggle('on-dark', over);
}

function fadeIn(img){
  const done = () => img.classList.add('loaded');
  if(img.complete && img.naturalWidth) requestAnimationFrame(done);
  else img.addEventListener('load', () => {
    (img.decode ? img.decode().catch(()=>{}) : Promise.resolve()).then(done);
  }, {once:true});
}

function render(){
  document.documentElement.classList.toggle('about', current==='about');
  document.documentElement.classList.toggle('portfolio', current==='portfolio');
  updateChrome();
  if(current==='about')      { main.innerHTML = aboutHTML();      return; }
  if(current==='experience') { main.innerHTML = experienceHTML(); return; }
  main.innerHTML = current==='portfolio' ? portfolioHTML() : carouselHTML(current);
  main.querySelectorAll('.entry').forEach(entry => { sizeFrame(entry); fadeIn(entry.querySelector('img')); });
  main.querySelectorAll('.sp-img').forEach(fadeIn);
  watchDarkPages();
}

/* Every Projects image gets the SAME height and is never wider than the
   column, so nothing below it shifts as the carousel advances and the
   frame stays centrable — an explicit width wider than its container
   cannot be centred by `margin: 0 auto`. The height is set so a 3:2
   frame fills the column exactly. */
const FRAME_H = { wide: 0.49, narrow: 0.32 };
function sizeFrame(entry){
  const img = entry.querySelector('img');
  const frame = entry.querySelector('.frame');
  const nw = +img.dataset.w || img.naturalWidth;
  const nh = +img.dataset.h || img.naturalHeight;
  if(!nw || !nh){ frame.style.width=''; frame.style.height=''; return; }
  const colW = entry.clientWidth || main.clientWidth;
  const h = Math.round(innerHeight * (innerWidth<=900 ? FRAME_H.narrow : FRAME_H.wide));
  const w = Math.min(Math.round(nw*h/nh), colW);
  frame.style.height = h+'px';
  frame.style.width  = w+'px';
  const p = BY_ID[entry.dataset.pid];
  const sc = p && (IMG[p.peek[+entry.dataset.i]]||{}).sc;
  img.style.transform = sc ? `scale(${sc})` : '';
}

function step(entry, delta){
  const p = BY_ID[entry.dataset.pid], total = p.peek.length;
  const i = (+entry.dataset.i + delta + total) % total;
  entry.dataset.i = i;
  const s = IMG[p.peek[i]], img = entry.querySelector('img');
  img.dataset.w = s.w; img.dataset.h = s.h;
  img.src = s.src;
  img.alt = `${p.name}, image ${i+1} of ${total}`;
  img.classList.add('loaded');
  entry.querySelector('.counter').textContent = `${i+1} of ${total}`;
  sizeFrame(entry);
}

main.addEventListener('click', e => {
  const arrow = e.target.closest('.arrow');
  if(arrow){ step(arrow.closest('.entry'), arrow.classList.contains('next') ? 1 : -1); return; }
  const btn = e.target.closest('.info-toggle');
  if(!btn) return;
  const info = btn.parentElement.previousElementSibling;
  const open = info.hidden;
  info.hidden = !open;
  btn.textContent = open ? 'Close' : 'Info';
  btn.setAttribute('aria-expanded', String(open));
});

addEventListener('keydown', e => {
  if(current!=='projects') return;
  if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
  const mid = innerHeight/2;
  let best=null, bestD=Infinity;
  for(const entry of main.querySelectorAll('.entry')){
    const r = entry.querySelector('.frame').getBoundingClientRect();
    const d = Math.abs((r.top+r.bottom)/2 - mid);
    if(d<bestD){ bestD=d; best=entry; }
  }
  if(best){ step(best, e.key==='ArrowRight' ? 1 : -1); e.preventDefault(); }
});

let resizeQueued = false;
addEventListener('resize', () => {
  if(resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => { resizeQueued=false; main.querySelectorAll('.entry').forEach(sizeFrame); });
});

document.querySelectorAll('a[href^="#/"]').forEach(a => {
  a.addEventListener('click', () => { if(a.getAttribute('href').slice(2)===current) scrollTo(0,0); });
});

addEventListener('hashchange', () => {
  const r = routeFromHash();
  if(r!==current){ current=r; render(); }
  scrollTo(0,0);
});

/* Projects is the home route: it renders at the bare URL with no fragment,
   so the site's address is fatimacastro.com rather than
   fatimacastro.com/#/projects. An explicit #/projects still works, for
   links already out in the world, and is normalised away on arrival. */
const bareURL = () => location.pathname + location.search;
function goHome(e){
  e.preventDefault();
  if(location.hash) history.pushState(null, '', bareURL());
  if(current !== 'projects'){ current = 'projects'; render(); }
  scrollTo(0,0);
}
document.querySelectorAll('a[href="#/projects"]')
  .forEach(a => a.addEventListener('click', goHome));

if(location.hash && routeFromHash()==='projects')
  history.replaceState(null, '', bareURL());
current = routeFromHash();
render();
</script>

</body>
</html>

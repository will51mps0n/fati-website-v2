<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fati Architects</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Fati Architects — a small studio working between building, drawing, and repair. Selected buildings, objects, and rooms.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap">
<style>
:root{--bg:#FCFBF9;--fg:#111111}
html.about{--bg:#080808;--fg:#F5F3EF}
html{background:var(--bg);scroll-behavior:auto}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--fg);
  font-family:"EB Garamond","Adobe Garamond Pro",Garamond,Georgia,serif;
  font-weight:550;
  font-variant-numeric:oldstyle-nums;
  font-feature-settings:"onum" 1,"liga" 1;
  -webkit-font-smoothing:antialiased;
}
[hidden]{display:none!important}
img{max-width:100%}

/* ---- the only affordance ---- */
a{color:inherit;text-decoration:none}
.info-toggle{font:inherit;font-variant-numeric:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a:focus-visible,.info-toggle:focus-visible{outline:none}
a:hover,a:focus-visible,
.about-link.active,
.info-toggle{
  text-decoration:underline;
  text-underline-offset:.14em;
  text-decoration-thickness:1px;
}

/* ---- fixed chrome ---- */
.wordmark,.about-link,.nav,.ig{position:fixed;z-index:10}
.wordmark{
  top:calc(34px + env(safe-area-inset-top,0px));
  left:calc(34px + env(safe-area-inset-left,0px));
  font-size:44px;line-height:1;letter-spacing:.01em;
}
.about-link{
  top:calc(34px + env(safe-area-inset-top,0px));
  right:calc(34px + env(safe-area-inset-right,0px));
  font-size:44px;line-height:1;
}
.nav{
  left:calc(34px + env(safe-area-inset-left,0px));
  bottom:calc(34px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:flex-start;
  font-size:38px;line-height:1.10;
}
.ig{
  right:calc(34px + env(safe-area-inset-right,0px));
  bottom:calc(34px + env(safe-area-inset-bottom,0px));
  line-height:0;
}
.ig svg{width:26px;height:26px;display:block}

/* ---- the column: one entry per project ---- */
#main{width:46vw;max-width:1040px;min-width:520px;margin:0 auto;padding:18vh 0 42vh}
.entry{margin:0 0 45vh}
.entry:last-child{margin-bottom:0}

.frame{position:relative;margin:0 auto}
.frame img{display:block;width:100%;height:auto;opacity:0;transition:opacity .4s ease}
.frame img.loaded{opacity:1}

/* carousel arrows — appear on hover, just outside the image */
.arrow{
  position:absolute;top:0;bottom:0;width:calc(50% + 72px);
  display:flex;align-items:center;
  background:none;border:0;margin:0;padding:0;
  color:inherit;cursor:pointer;opacity:0;transition:opacity 80ms linear;
}
.arrow.prev{left:-72px;justify-content:flex-start;padding-left:18px}
.arrow.next{right:-72px;justify-content:flex-end;padding-right:18px}
.arrow:hover,.arrow:focus-visible{opacity:1;transition-duration:80ms}
.arrow:not(:hover){transition-duration:0s}
.arrow svg{width:22px;height:22px;display:block}
.arrow:focus-visible{outline:none}

figcaption{margin-top:26px;text-align:center;font-size:22px;line-height:1.42}
.cap-name,.cap-award{font-style:italic}
.awards{margin-top:1.42em}
.info{margin:1.42em auto;width:30vw;max-width:30vw;font-size:20px;line-height:1.5}

/* ---- about ---- */
html.about #main{width:auto;max-width:none;min-width:0;padding:0}
.about-wrap{min-height:100vh;display:grid;place-items:center;box-sizing:border-box;padding:14vh 0}
.manifesto{width:60vw;margin:0;font-size:48px;line-height:1.3;text-align:center}

@media (prefers-reduced-motion:reduce){.frame img{transition:none}}

/* ---- below 900px ---- */
@media (max-width:900px){
  #main{width:86vw;min-width:0}
  .wordmark,.about-link{font-size:26px}
  .wordmark{top:calc(20px + env(safe-area-inset-top,0px));left:calc(20px + env(safe-area-inset-left,0px))}
  .about-link{top:calc(20px + env(safe-area-inset-top,0px));right:calc(20px + env(safe-area-inset-right,0px))}
  .nav{flex-direction:row;gap:16px;font-size:22px;line-height:1.2;
       left:calc(20px + env(safe-area-inset-left,0px));
       bottom:calc(62px + env(safe-area-inset-bottom,0px))}
  .ig{right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .arrow{width:50%}
  .arrow.prev{left:0;padding-left:10px}
  .arrow.next{right:0;padding-right:10px}
  figcaption{font-size:19px}
  .entry{margin-bottom:28vh}
  .info{width:80vw;max-width:80vw;font-size:17px}
  .manifesto{width:88vw;font-size:28px}
}
</style>
</head>
<body>

<a class="wordmark" href="#/selected">FATI ARCHITECTS</a>
<a class="about-link" href="#/about">About</a>
<nav class="nav" aria-label="Collections">
  <a href="#/selected">Selected</a>
  <a href="#/buildings">Buildings</a>
  <a href="#/objects">Objects</a>
  <a href="#/rooms">Rooms</a>
</nav>
<a class="ig" href="https://www.instagram.com" target="_blank" rel="noopener" aria-label="Instagram">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
    <rect x="2.75" y="2.75" width="18.5" height="18.5" rx="5.2"/>
    <circle cx="12" cy="12" r="4.4"/>
    <circle cx="17.15" cy="6.85" r="1.05" fill="currentColor" stroke="none"/>
  </svg>
</a>

<main id="main"></main>

<script>
/* ================================================================
   DATA — edit projects here.
   Each project is ONE slot in the vertical feed; its images are a
   horizontal carousel inside that slot. The caption counter reads
   "{n} of {images.length}" and restarts at the next project.

   `images` accepts either a plain URL string or {src, w, h}. Giving
   w/h lets the frame size itself before the image loads (no reflow);
   plain strings fall back to the image's natural size on load.
   ================================================================ */
const PROJECTS = [
  {
    id: 'kestrel-house',
    name: 'Kestrel House',
    subtitle: 'A Long Roof Against the Weather',
    medium: 'photograph',
    awards: ['Award, AIA Michigan Honor 2024', 'Award, Small Practice Citation 2021'],
    collections: ['selected', 'buildings'],
    info: { date: '2017-2024', client: 'Undisclosed', location: 'Leelanau County, Michigan',
            type: 'Residence', status: 'Complete', aor: 'Field Office Architects',
            builder: 'North Shore Builders', photography: 'Studio archive' },
    images: placeholderImages('kestrel-house', 48, 'photo-wide')
  },
  {
    id: 'hillside-sections',
    name: 'Hillside Sections',
    subtitle: 'Seven Cuts Through a Slow Slope',
    medium: 'section drawing',
    awards: ['Award, Drawing of the Year Shortlist 2023'],
    collections: ['selected', 'buildings'],
    info: { date: '2018-Ongoing', client: '', location: 'Driftless Region, Wisconsin',
            type: 'Terraced House', status: 'Ongoing', aor: 'Field Office Architects',
            builder: '', photography: '' },
    images: placeholderImages('hillside-sections', 27, 'drawing')
  },
  {
    id: 'quiet-room',
    name: 'Quiet Room',
    subtitle: 'One Window, Held Open All Day',
    medium: 'photograph',
    awards: [],
    collections: ['selected', 'rooms'],
    info: { date: '2021-2023', client: 'Private', location: 'Ann Arbor, Michigan',
            type: 'Interior', status: 'Complete', aor: '',
            builder: 'Meridian Joinery', photography: 'Studio archive' },
    images: placeholderImages('quiet-room', 23, 'photo-room')
  },
  {
    id: 'ledger-objects',
    name: 'Ledger Objects',
    subtitle: 'Furniture for Counting and Keeping',
    medium: 'photograph',
    awards: ['Award, Object Prize 2024'],
    collections: ['selected', 'objects'],
    info: { date: '2024', client: 'Undisclosed', location: '',
            type: 'Furniture', status: 'Complete', aor: '',
            builder: 'Studio workshop', photography: 'Studio archive' },
    images: placeholderImages('ledger-objects', 20, 'photo-object')
  },
  {
    id: 'salt-chapel',
    name: 'Salt Chapel',
    subtitle: 'A Cold Room for Warm Voices',
    medium: 'photograph',
    awards: ['Award, Sacred Space Medal 2022', 'Award, Timber Construction Citation 2023'],
    collections: ['selected', 'buildings', 'rooms'],
    info: { date: '2019-2022', client: '', location: 'Door County, Wisconsin',
            type: 'Chapel', status: 'Complete', aor: 'Field Office Architects',
            builder: 'Peninsula Timberworks', photography: 'Studio archive' },
    images: placeholderImages('salt-chapel', 29, 'photo-wide')
  },
  {
    id: 'standing-figures',
    name: 'Standing Figures',
    subtitle: 'Low Fidelity Entasis',
    medium: 'drawing',
    awards: [],
    collections: ['selected', 'objects'],
    info: { date: '2020', client: '', location: '',
            type: 'Speculative Study', status: 'Study', aor: '',
            builder: '', photography: '' },
    images: placeholderImages('standing-figures', 6, 'drawing')
  }
];

const MANIFESTO = 'Fati Architects is a small studio working between building, drawing, and repair. We begin with what a place already holds — its weather, its debris, its habits of light — and we build slowly from there. We prefer one good room to many adequate ones, a long roof to a tall wall, the measured drawing to the rendering. Our work is finished by the people who live in it and by the seasons that pass over it. We keep the studio small on purpose, taking few projects and staying with each of them for years, from first survey to final photograph.';

/* Each collection's feed is derived from PROJECTS, in declaration order. */
const COLLECTIONS = { selected: [], buildings: [], objects: [], rooms: [] };
for (const p of PROJECTS) for (const c of p.collections) if (COLLECTIONS[c]) COLLECTIONS[c].push(p.id);
const BY_ID = Object.fromEntries(PROJECTS.map(p => [p.id, p]));

const INFO_FIELDS = [
  ['date','Date'], ['client','Client'], ['location','Location'], ['type','Type'],
  ['status','Status'], ['aor','AOR'], ['builder','Builder'], ['photography','Photography']
];

/* ================================================================
   Deterministic placeholder image service (inline).
   Same (id, index) always yields the same image.
   ================================================================ */
function hashSeed(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pick(r,arr){return arr[Math.floor(r()*arr.length)]}
function R(x){return Math.round(x)}
function svgURI(s){return 'data:image/svg+xml;utf8,'+encodeURIComponent(s)}

function placeholderImages(id,count,kind){
  const out=[];
  for(let i=0;i<count;i++) out.push(kind==='drawing'?drawingSVG(id,i):photoSVG(id,i,kind));
  return out;
}

/* Soft warm-grey abstractions standing in for photographs. */
function photoSVG(id,i,kind){
  const r=rng(hashSeed(id+'/'+i));
  const ratios = kind==='photo-object' ? [[1,1],[1,1],[4,5],[5,4],[3,4]]
               : kind==='photo-room'   ? [[4,3],[3,2],[1,1],[3,4],[16,10]]
               :                         [[3,2],[16,9],[2,1],[4,3],[1,1],[3,4]];
  const [rw,rh]=pick(r,ratios), W=1440, H=R(W*rh/rw);
  const g=l=>`hsl(38,${6+R(r()*5)}%,${R(l)}%)`;
  const horizon=R(H*(0.52+r()*0.26));
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">`;
  s+=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${g(88+r()*6)}"/><stop offset="1" stop-color="${g(78+r()*8)}"/></linearGradient></defs>`;
  s+=`<rect width="${W}" height="${H}" fill="url(#sky)"/>`;
  s+=`<rect y="${horizon}" width="${W}" height="${H-horizon}" fill="${g(70+r()*8)}"/>`;
  const n = kind==='photo-object' ? 1 : 1+Math.floor(r()*3);
  for(let k=0;k<n;k++){
    const mw=R(W*(0.16+r()*0.34)), mh=R(H*(0.18+r()*0.34));
    const mx = kind==='photo-object' ? R((W-mw)/2) : R(r()*(W-mw));
    const my = R(horizon-mh - (kind==='photo-object' ? H*0.04*r() : 0));
    s+=`<rect x="${mx}" y="${my}" width="${mw}" height="${mh}" fill="${g(28+r()*34)}"/>`;
    if(kind!=='photo-object' && r()<0.8){
      const cols=1+Math.floor(r()*4);
      for(let c=0;c<cols;c++){
        s+=`<rect x="${R(mx+mw*(0.12+c*0.22))}" y="${R(my+mh*0.25)}" width="${R(mw*0.08)}" height="${R(mh*(0.2+r()*0.4))}" fill="${g(14+r()*14)}"/>`;
      }
    }
  }
  s+=`<rect y="${horizon-1}" width="${W}" height="2" fill="${g(40)}" opacity="0.5"/>`;
  s+='</svg>';
  return {src:svgURI(s),w:W,h:H};
}

/* Black line drawings — plan/section style, transparent ground. */
function drawingSVG(id,i){
  const r=rng(hashSeed(id+'/'+i));
  const [rw,rh]=pick(r,[[2,3],[9,16],[1,2],[10,17],[3,5]]);
  const W=1000, H=R(W*rh/rw), m=90;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">`;
  s+=`<defs><pattern id="h" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="14" stroke="#111" stroke-width="1.4"/></pattern></defs>`;
  s+=`<g stroke="#111" stroke-width="2.2" fill="none" stroke-linecap="square">`;
  if(r()<0.35){
    /* plan */
    const bx=m, bw=W-2*m, by=R(H*0.12), bh=R(H*0.7+r()*H*0.1);
    const t=14;
    s+=`<rect x="${bx}" y="${by}" width="${bw}" height="${bh}"/>`;
    s+=`<rect x="${bx+t}" y="${by+t}" width="${bw-2*t}" height="${bh-2*t}"/>`;
    const rooms=2+Math.floor(r()*3);
    for(let k=0;k<rooms;k++){
      const y=R(by+bh*(0.2+r()*0.6));
      s+=`<line x1="${bx+t}" y1="${y}" x2="${bx+bw-t}" y2="${y}"/>`;
      const dx=R(bx+t+ (bw-2*t)*(0.15+r()*0.5));
      s+=`<path d="M ${dx} ${y} a 70 70 0 0 1 70 -70" stroke-width="1.2"/>`;
      s+=`<line x1="${dx}" y1="${y}" x2="${dx}" y2="${y-70}" stroke-width="1.2"/>`;
    }
    const vx=R(bx+bw*(0.3+r()*0.4));
    s+=`<line x1="${vx}" y1="${by+t}" x2="${vx}" y2="${by+bh-t}"/>`;
    s+=`<line x1="${bx}" y1="${R(by+bh+40)}" x2="${bx+bw}" y2="${R(by+bh+40)}" stroke-width="1"/>`;
    for(const x of [bx,bx+bw]) s+=`<line x1="${x-7}" y1="${R(by+bh+47)}" x2="${x+7}" y2="${R(by+bh+33)}" stroke-width="1.2"/>`;
  } else {
    /* section */
    const ground=H-m-R(r()*H*0.08);
    s+=`<line x1="${R(m*0.4)}" y1="${ground}" x2="${R(W-m*0.4)}" y2="${ground}" stroke-width="4"/>`;
    s+=`<rect x="${R(m*0.4)}" y="${ground}" width="${R(W-m*0.8)}" height="26" fill="url(#h)" stroke="none"/>`;
    const bx=m, bw=W-2*m, top=m+R(r()*H*0.12);
    s+=`<rect x="${bx}" y="${top}" width="${bw}" height="${ground-top}"/>`;
    const floors=3+Math.floor(r()*4);
    for(let f=1;f<floors;f++){
      const y=R(top+(ground-top)*f/floors);
      s+=`<line x1="${bx}" y1="${y}" x2="${bx+bw}" y2="${y}"/>`;
      s+=`<rect x="${bx}" y="${y}" width="${bw}" height="8" fill="url(#h)" stroke="none"/>`;
    }
    for(let v=0,vn=1+Math.floor(r()*3);v<vn;v++){
      const x=R(bx+bw*(0.2+r()*0.6)), y1=R(top+(ground-top)*r()*0.5);
      s+=`<line x1="${x}" y1="${y1}" x2="${x}" y2="${ground}"/>`;
    }
    if(r()<0.7){
      const peak=R(bx+bw*(0.3+r()*0.4)), py=Math.max(30,top-R(H*0.06+r()*H*0.08));
      s+=`<polyline points="${bx},${top} ${peak},${py} ${bx+bw},${top}"/>`;
    }
    if(r()<0.6){
      let x=bx+bw*0.15, y=ground, pts=`${R(x)},${R(y)}`;
      const steps=6+Math.floor(r()*6), stw=bw*0.03, sth=(ground-top)*0.5/steps;
      for(let t2=0;t2<steps;t2++){y-=sth;pts+=` ${R(x)},${R(y)}`;x+=stw;pts+=` ${R(x)},${R(y)}`}
      s+=`<polyline points="${pts}" stroke-width="1.4"/>`;
    }
    const tx=R(W-m*0.55);
    s+=`<line x1="${tx}" y1="${top}" x2="${tx}" y2="${ground}" stroke-width="1"/>`;
    for(const y of [top,ground]) s+=`<line x1="${tx-7}" y1="${y+7}" x2="${tx+7}" y2="${y-7}" stroke-width="1.2"/>`;
  }
  s+='</g></svg>';
  return {src:svgURI(s),w:W,h:H};
}

/* Accept either 'url' or {src,w,h} in the data. */
function shot(p,i){const v=p.images[i];return typeof v==='string'?{src:v,w:0,h:0}:v}

/* ================================================================
   Routing and rendering
   ================================================================ */
const ROUTES=['selected','buildings','objects','rooms','about'];
const ARROW_L='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><line x1="21" y1="12" x2="4" y2="12"/><polyline points="10.5,5.5 4,12 10.5,18.5"/></svg>';
const ARROW_R='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><line x1="3" y1="12" x2="20" y2="12"/><polyline points="13.5,5.5 20,12 13.5,18.5"/></svg>';
let current=null;
const main=document.getElementById('main');

function routeFromHash(){
  const h=location.hash.replace(/^#\/?/,'').toLowerCase();
  return ROUTES.includes(h)?h:'selected';
}

function infoLines(p){
  return INFO_FIELDS.filter(([k])=>p.info[k]).map(([k,label])=>`<div>${label}: ${p.info[k]}</div>`).join('');
}

function updateChrome(){
  document.querySelectorAll('.nav a').forEach(a=>{
    if(a.getAttribute('href').slice(2)===current) a.setAttribute('aria-current','page');
    else a.removeAttribute('aria-current');
  });
  document.querySelector('.about-link').classList.toggle('active',current==='about');
}

function render(){
  document.documentElement.classList.toggle('about',current==='about');
  updateChrome();
  if(current==='about'){
    main.innerHTML=`<div class="about-wrap"><p class="manifesto">${MANIFESTO}</p></div>`;
    return;
  }
  let html='';
  for(const pid of COLLECTIONS[current]){
    const p=BY_ID[pid], total=p.images.length, s=shot(p,0);
    html+=`<figure class="entry" data-pid="${pid}" data-i="0">`
        + `<div class="frame">`
        +   `<img src="${s.src}" data-w="${s.w}" data-h="${s.h}" loading="lazy" alt="${p.name} — ${p.medium} 1 of ${total}">`
        +   (total>1
              ? `<button class="arrow prev" type="button" aria-label="Previous image of ${p.name}">${ARROW_L}</button>`
                + `<button class="arrow next" type="button" aria-label="Next image of ${p.name}">${ARROW_R}</button>`
              : '')
        + `</div>`
        + `<figcaption>`
        +   `<div class="counter">1 of ${total}</div>`
        +   `<div class="cap-name">${p.name}</div>`
        +   `<div>${p.subtitle}</div>`
        +   (p.awards.length
              ? `<div class="awards">${p.awards.map(a=>`<div class="cap-award">${a}</div>`).join('')}</div>`
              : '')
        +   `<div class="info" hidden>${infoLines(p)}</div>`
        +   `<div><button class="info-toggle" type="button" aria-expanded="false">Info</button></div>`
        + `</figcaption>`
        + `</figure>`;
  }
  main.innerHTML=html;
  main.querySelectorAll('.entry').forEach(entry=>{
    sizeFrame(entry);
    const img=entry.querySelector('img');
    const done=()=>img.classList.add('loaded');
    if(img.complete&&img.naturalWidth) requestAnimationFrame(done);
    else img.addEventListener('load',()=>{(img.decode?img.decode().catch(()=>{}):Promise.resolve()).then(done)},{once:true});
  });
}

/* The frame hugs the painted image, so the arrows sit just outside
   its real edges rather than the column's. */
function sizeFrame(entry){
  const img=entry.querySelector('img');
  const frame=entry.querySelector('.frame');
  const nw=+img.dataset.w||img.naturalWidth;
  const nh=+img.dataset.h||img.naturalHeight;
  if(!nw||!nh){frame.style.width='';return}
  const colW=entry.clientWidth||main.clientWidth;
  const scale=Math.min(colW/nw,(window.innerHeight*0.78)/nh);
  frame.style.width=Math.round(nw*scale)+'px';
}

/* Move within one project's carousel; the counter is scoped to it. */
function step(entry,delta){
  const p=BY_ID[entry.dataset.pid], total=p.images.length;
  const i=(+entry.dataset.i+delta+total)%total;
  entry.dataset.i=i;
  const s=shot(p,i), img=entry.querySelector('img');
  img.dataset.w=s.w; img.dataset.h=s.h;
  img.src=s.src;
  img.alt=`${p.name} — ${p.medium} ${i+1} of ${total}`;
  img.classList.add('loaded');
  entry.querySelector('.counter').textContent=`${i+1} of ${total}`;
  sizeFrame(entry);
}

main.addEventListener('click',e=>{
  const arrow=e.target.closest('.arrow');
  if(arrow){step(arrow.closest('.entry'),arrow.classList.contains('next')?1:-1);return}
  const btn=e.target.closest('.info-toggle');
  if(!btn) return;
  const info=btn.parentElement.previousElementSibling;
  const open=info.hidden;
  info.hidden=!open;
  btn.textContent=open?'Close':'Info';
  btn.setAttribute('aria-expanded',String(open));
});

/* Arrow keys drive whichever project is nearest the middle of the screen. */
addEventListener('keydown',e=>{
  if(current==='about') return;
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight') return;
  const mid=innerHeight/2;
  let best=null,bestD=Infinity;
  for(const entry of main.querySelectorAll('.entry')){
    const r=entry.querySelector('.frame').getBoundingClientRect();
    const d=Math.abs((r.top+r.bottom)/2-mid);
    if(d<bestD){bestD=d;best=entry}
  }
  if(best){step(best,e.key==='ArrowRight'?1:-1);e.preventDefault()}
});

let resizeQueued=false;
addEventListener('resize',()=>{
  if(resizeQueued) return;
  resizeQueued=true;
  requestAnimationFrame(()=>{resizeQueued=false;main.querySelectorAll('.entry').forEach(sizeFrame)});
});

/* Re-clicking the active route (or the wordmark on it) jumps to top. */
document.querySelectorAll('a[href^="#/"]').forEach(a=>{
  a.addEventListener('click',()=>{
    if(a.getAttribute('href').slice(2)===current) scrollTo(0,0);
  });
});

addEventListener('hashchange',()=>{
  const r=routeFromHash();
  if(r!==current){current=r;render()}
  scrollTo(0,0);
});

if(!location.hash) history.replaceState(null,'','#/selected');
current=routeFromHash();
render();
</script>
